
name: Build Eclipse Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract project
        run: |
          mkdir project
          unzip -q "$(find . -maxdepth 1 -name '*.zip' | head -n 1)" -d project
          echo "PROJECT_DIR=$(dirname "$(find project -name package.json -print -quit)")" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: cd "$PROJECT_DIR" && npm install

      - name: Prepare Android
        run: |
          cd "$PROJECT_DIR"
          npm run prepare:android
          npx cap add android
          node tools/patch-android-manifest.mjs
          npx cap sync android

      - name: Build APK
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Eclipse-Android-APK
          path: project/**/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
